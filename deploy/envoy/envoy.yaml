admin:
  access_log_path: /tmp/envoy-admin-access.log
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: tls_passthrough_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8443
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: tls_passthrough
                cluster: mergen_forwarder_tls

  clusters:
    - name: mergen_forwarder_tls
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: mergen_forwarder_tls
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      # mergen-forwarder currently runs on host and listens TLS :443.
                      address: host.docker.internal
                      port_value: 443
